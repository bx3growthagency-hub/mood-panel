# Panel de Mood by BX3. Proyecto de Cloudflare Pages propio, separado de
# "deuntap" (ver DECISION_HOSTING.md). Todavía NO está creado ni publicado.
name = "mood-panel"
pages_build_output_dir = "public"
compatibility_date = "2026-10-01"

# Base propia del panel: capturas de Instagram, Google y plan.
# El database_id es un marcador: se reemplaza al crear la base real
# (npx wrangler d1 create mood-panel), con el visto bueno de Leandro.
[[d1_databases]]
binding = "PANEL"
database_name = "mood-panel"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# Base de los stands de De un tap. El panel SOLO hace SELECT.
# migrations_dir apunta a una carpeta vacía a propósito: así un
# "d1 migrations apply deuntap-toques" lanzado aquí por error no aplica nada.
[[d1_databases]]
binding = "TOQUES"
database_name = "deuntap-toques"
database_id = "6181a17a-e9cb-426f-b927-92a68d0ae171"
migrations_dir = "local/no-migrar"

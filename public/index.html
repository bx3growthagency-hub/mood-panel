<!doctype html>
<html lang="es-CO">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <title>Mood · Panel de marca</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="estilos.css" />
  </head>
  <body>
    <a class="salto" href="#contenido">Saltar al contenido</a>
    <header class="cabecera">
      <div class="cabecera-fila">
        <p class="marca"><span class="marca-nombre">Mood</span><span class="marca-sub">Panel de marca · por BX3</span></p>
        <p class="corte" id="corte"></p>
      </div>
      <nav id="pestanas" class="pestanas" aria-label="Secciones del panel" hidden></nav>
    </header>
    <main id="contenido">
      <p id="estado" class="estado" role="status">Cargando el panel…</p>
    </main>
    <footer class="pie" id="pie" hidden></footer>
    <div id="tip" class="tip" role="status" hidden></div>
    <script type="module" src="app.js"></script>
  </body>
</html>
